name: Build and test

on:
  push:
    branches: [main, feat/process-pipeline-foundation, feat/archive-staging, feat/artifact-receipts, feat/artifact-outbox, feat/lease-aware-staging, feat/stage-only-control-plane, feat/stage-lease-renewal]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore pinned dependencies
        run: dotnet restore BuildSystem.slnx --locked-mode
      - name: Restore pinned EF tooling
        run: dotnet tool restore
      - name: Build
        run: dotnet build BuildSystem.slnx --configuration Release --no-restore
      - name: Verify migration model without SQL connection
        env:
          BUILDSYSTEM_DESIGN_CONNECTION: 'Server=unused;Database=unused;Integrated Security=true'
        run: dotnet ef migrations has-pending-model-changes --project src/Server/BuildSystem.Infrastructure --configuration Release --no-build
      - name: Test domain, HTTP, SQLite, process and pipeline contracts (SQL requires opt-in)
        run: dotnet test BuildSystem.slnx --configuration Release --no-build --no-restore --logger trx --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.os }}
          path: TestResults/*.trx
          if-no-files-found: warn
