name: Build and test

on:
  push:
    branches: [main, feat/process-pipeline-foundation, feat/archive-staging, feat/artifact-receipts, feat/artifact-outbox, feat/lease-aware-staging, feat/stage-only-control-plane, feat/stage-lease-renewal, feat/stage-completion, feat/stage-status, feat/stage-operations-list, feat/stage-operator-ui, test/stage-ui-behavior, feat/archive-catalog, feat/project-archive-browser, feat/archive-order-ui, feat/stage-retention-explanation, feat/stage-retirement-intent, feat/stage-retirement-plan, feat/stage-cleanup-authorization, feat/local-stage-cleanup-executor, feat/stage-cleanup-result, feat/staging-allocation-release, feat/cleanup-lifecycle-status, feat/cleanup-result-delivery, feat/cleanup-delivery-command, fix/retirement-queue-progress, test/cleanup-real-tls, test/cleanup-api-pipeline, test/cleanup-admin-cookie, test/cleanup-request-boundaries, test/cleanup-http-concurrency, feat/dt-restore-planning]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test operator UI behavior
        run: node --test tests/stage-ui.test.cjs
      - name: Restore pinned dependencies
        run: dotnet restore BuildSystem.slnx --locked-mode
      - name: Restore pinned EF tooling
        run: dotnet tool restore
      - name: Build
        run: dotnet build BuildSystem.slnx --configuration Release --no-restore
      - name: Verify migration model without SQL connection
        env:
          BUILDSYSTEM_DESIGN_CONNECTION: 'Server=unused;Database=unused;Integrated Security=true'
        run: dotnet ef migrations has-pending-model-changes --project src/Server/BuildSystem.Infrastructure --configuration Release --no-build
      - name: Test domain, HTTP, SQLite, process and pipeline contracts (SQL requires opt-in)
        run: dotnet test BuildSystem.slnx --configuration Release --no-build --no-restore --logger trx --results-directory TestResults
      - name: Annotate failed tests without publishing exception bodies
        if: always()
        shell: python
        run: |
          import pathlib, xml.etree.ElementTree as ET
          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          count = 0
          for path in pathlib.Path('TestResults').glob('*.trx'):
              root = ET.parse(path).getroot()
              for result in root.findall('.//t:UnitTestResult', ns):
                  if result.get('outcome') == 'Failed':
                      name = result.get('testName', 'Unknown test').replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print('::error title=Failed test::' + name)
                      count += 1
          print('Failed test results: ' + str(count))
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.os }}
          path: TestResults/*.trx
          if-no-files-found: warn
