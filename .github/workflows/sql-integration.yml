name: SQL Server metadata integration

on:
  workflow_dispatch:
  push:
    branches:
      - feat/agent-control-plane
      - feat/archive-staging
      - feat/artifact-receipts
      - feat/artifact-outbox
      - feat/lease-aware-staging
      - feat/stage-only-control-plane
      - feat/stage-lease-renewal

permissions:
  contents: read

jobs:
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU20-ubuntu-22.04
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: 'BsCi_Only_Ephemeral_739!'
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'BsCi_Only_Ephemeral_739!' -C -Q 'SELECT 1' -b -o /dev/null"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
          --health-start-period=20s
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      BUILDSYSTEM_TEST_SQL_ALLOW_CREATE: 'true'
      # Disposable job-local service only. This is not an internal/production credential.
      BUILDSYSTEM_TEST_SQL: 'Server=localhost,1433;Initial Catalog=master;User ID=sa;Password=BsCi_Only_Ephemeral_739!;Encrypt=true;TrustServerCertificate=true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore BuildSystem.slnx --locked-mode
      - run: dotnet test tests/BuildSystem.IntegrationTests/BuildSystem.IntegrationTests.csproj --configuration Release --no-restore --logger trx --results-directory TestResults
      - name: Verify SQL tests executed without skips
        shell: python
        run: |
          import glob, xml.etree.ElementTree as ET
          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          results = []
          for path in glob.glob('TestResults/*.trx'):
              results.extend(ET.parse(path).getroot().findall('t:Results/t:UnitTestResult', ns))
          passed = sum(r.get('outcome') == 'Passed' for r in results)
          print(f'SQL TRX: {passed} passed / {len(results)} total')
          assert len(results) >= 34, 'SQL suite missing expected test coverage'
          assert passed == len(results), 'SQL tests failed or were skipped'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sql-integration-results
          path: TestResults/*.trx
          if-no-files-found: error
# End.
